name: educare_app
description: "Educational app for autistic children to learn vowels"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  audioplayers: ^5.2.1
  google_fonts: ^6.1.0
  flutter_blue_plus: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/vogais/
    - assets/audio/silabas/
    - assets/audio/palavras/

